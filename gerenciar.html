<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Administrativo | Freitas Silqueira Advocacia</title>
  <style>
    :root {
      --bg-dark: #111214;
      --bg-card: #1a1c20;
      --bg-input: #23262b;
      --gold: #c9a45c;
      --gold-hover: #dfbc74;
      --text-main: #f2f2f2;
      --text-muted: #9da3ae;
      --border: #2e3239;
      --danger: #d9534f;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
    }

    #login-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .login-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-top: 3px solid var(--gold);
      padding: 40px 32px;
      border-radius: 8px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 12px 30px rgba(0,0,0,0.5);
    }

    .login-box h2 {
      color: var(--gold);
      font-size: 1.3rem;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .login-box p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 24px;
    }

    #admin-panel {
      display: none;
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 20px 60px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 18px;
      margin-bottom: 28px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .brand h1 { font-size: 1.25rem; color: var(--gold); font-weight: 600; }
    .header-actions { display: flex; gap: 10px; }

    .grid-layout {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 28px;
    }

    @media (max-width: 860px) {
      .grid-layout { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px;
    }

    .card h3 {
      color: var(--gold);
      font-size: 1.1rem;
      margin-bottom: 18px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .form-group { margin-bottom: 16px; text-align: left; }

    label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="password"],
    input[type="date"],
    input[type="url"],
    select,
    textarea {
      width: 100%;
      padding: 11px 14px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--gold);
    }

    textarea { resize: vertical; min-height: 90px; }

    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .btn {
      padding: 11px 18px;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-gold {
      background: var(--gold);
      color: #111;
      width: 100%;
    }

    .btn-gold:hover { background: var(--gold-hover); }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 8px 14px;
      font-size: 0.85rem;
    }

    .btn-outline:hover { border-color: var(--gold); color: var(--gold); }

    .btn-danger {
      background: rgba(217, 83, 79, 0.15);
      color: #ff7b77;
      border: 1px solid rgba(217, 83, 79, 0.3);
      padding: 6px 10px;
      font-size: 0.8rem;
    }

    .btn-danger:hover { background: var(--danger); color: #fff; }

    .btn-edit {
      background: rgba(201, 164, 92, 0.15);
      color: var(--gold);
      border: 1px solid rgba(201, 164, 92, 0.3);
      padding: 6px 10px;
      font-size: 0.8rem;
    }

    .btn-edit:hover { background: var(--gold); color: #111; }

    .preview-box {
      margin-top: 8px;
      max-height: 150px;
      border-radius: 6px;
      overflow: hidden;
      display: none;
      border: 1px solid var(--border);
    }

    .preview-box img {
      width: 100%;
      max-height: 150px;
      object-fit: cover;
      display: block;
    }

    .post-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 680px;
      overflow-y: auto;
    }

    .post-item {
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 14px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .post-info h4 {
      font-size: 0.98rem;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .badge {
      display: inline-block;
      font-size: 0.72rem;
      padding: 2px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      font-weight: 600;
      margin-right: 6px;
      background: rgba(201, 164, 92, 0.18);
      color: var(--gold);
    }

    .post-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .post-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .status-msg {
      margin-top: 12px;
      font-size: 0.88rem;
      text-align: center;
      min-height: 20px;
    }
  </style>
</head>
<body>

  <!-- TELA DE LOGIN -->
  <div id="login-screen">
    <div class="login-box">
      <h2>Acesso Restrito</h2>
      <p>Freitas Silqueira Advocacia</p>
      <form id="login-form">
        <div class="form-group">
          <label>Usuário</label>
          <input type="text" id="usuario-input" value="Stefania" required>
        </div>
        <div class="form-group">
          <label>Senha</label>
          <input type="password" id="senha-input" placeholder="Digite a senha" required>
        </div>
        <button type="submit" class="btn btn-gold" style="margin-top: 6px;">Entrar no Painel</button>
        <div id="login-erro" class="status-msg" style="color: #ff7b77;"></div>
      </form>
    </div>
  </div>

  <!-- PAINEL PRINCIPAL -->
  <div id="admin-panel">
    <header>
      <div class="brand">
        <h1>Gestão de Conteúdo | Freitas Silqueira</h1>
      </div>
      <div class="header-actions">
        <a href="index.html" target="_blank" class="btn btn-outline">Ver Site</a>
        <button onclick="sair()" class="btn btn-outline">Sair</button>
      </div>
    </header>

    <div class="grid-layout">
      <!-- FORMULÁRIO -->
      <div class="card">
        <h3 id="form-titulo">Nova Publicação</h3>
        <form id="post-form">
          <input type="hidden" id="post-id">
          <input type="hidden" id="imagem-base64">

          <div class="row-2">
            <div class="form-group">
              <label>Tipo de Conteúdo</label>
              <select id="tipo" onchange="alternarCampos()">
                <option value="artigo">Artigo Jurídico (Blog)</option>
                <option value="instagram">Destaque Instagram</option>
              </select>
            </div>
            <div class="form-group">
              <label>Data da Publicação</label>
              <input type="date" id="data" required>
            </div>
          </div>

          <div class="form-group">
            <label>Título da Publicação</label>
            <input type="text" id="titulo" placeholder="Ex: Direitos do Paciente na Negativa de Cirurgia" required>
          </div>

          <div class="row-2">
            <div class="form-group">
              <label>Área de Atuação</label>
              <select id="area">
                <option value="Direito da Saúde">Direito da Saúde</option>
                <option value="Direito Criminal / Habeas Corpus">Direito Criminal / Habeas Corpus</option>
                <option value="Direito Previdenciário">Direito Previdenciário</option>
                <option value="Direito Civil e Família">Direito Civil e Família</option>
                <option value="Informativo Institucional">Informativo Institucional</option>
              </select>
            </div>
            <div class="form-group">
              <label>Status</label>
              <select id="status">
                <option value="publicado">Publicado</option>
                <option value="rascunho">Rascunho (Oculto)</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label>Imagem de Capa</label>
            <input type="file" id="arquivo-imagem" accept="image/*" onchange="processarImagem(event)">
            <div class="preview-box" id="preview-box">
              <img id="preview-img" src="" alt="Prévia">
            </div>
          </div>

          <div class="form-group" id="grupo-link" style="display: none;">
            <label>Link da Postagem no Instagram</label>
            <input type="url" id="link" placeholder="https://www.instagram.com/p/...">
          </div>

          <div class="form-group">
            <label>Resumo Curto</label>
            <textarea id="resumo" rows="2" placeholder="Breve descrição..." required></textarea>
          </div>

          <div class="form-group" id="grupo-conteudo">
            <label>Texto Completo do Artigo</label>
            <textarea id="conteudo" rows="6" placeholder="Escreva o conteúdo..."></textarea>
          </div>

          <div style="display: flex; gap: 10px;">
            <button type="submit" class="btn btn-gold" id="btn-salvar">Salvar Publicação</button>
            <button type="button" class="btn btn-outline" id="btn-cancelar" style="display: none;" onclick="limparFormulario()">Cancelar</button>
          </div>
          <div id="form-status" class="status-msg"></div>
        </form>
      </div>

      <!-- LISTA -->
      <div class="card">
        <h3>Publicações no Ar</h3>
        <div id="lista-posts" class="post-list">
          <p style="color: var(--text-muted); font-size: 0.9rem;">Carregando...</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    let logado = sessionStorage.getItem("fs_logado") === "true";
    let senhaMaster = "Freitas@2026";
    let postsCache = [];

    document.getElementById("data").valueAsDate = new Date();

    if (logado) {
      iniciarPainel();
    }

    document.getElementById("login-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const senha = document.getElementById("senha-input").value.trim();
      const erroEl = document.getElementById("login-erro");

      if (senha === senhaMaster) {
        sessionStorage.setItem("fs_logado", "true");
        erroEl.textContent = "";
        iniciarPainel();
      } else {
        erroEl.textContent = "Senha incorreta.";
      }
    });

    function iniciarPainel() {
      document.getElementById("login-screen").style.display = "none";
      document.getElementById("admin-panel").style.display = "block";
      carregarPosts();
    }

    function sair() {
      sessionStorage.removeItem("fs_logado");
      location.reload();
    }

    function alternarCampos() {
      const tipo = document.getElementById("tipo").value;
      document.getElementById("grupo-link").style.display = tipo === "instagram" ? "block" : "none";
      document.getElementById("grupo-conteudo").style.display = tipo === "artigo" ? "block" : "none";
    }

    function processarImagem(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement("canvas");
          const MAX_WIDTH = 800;
          let width = img.width;
          let height = img.height;

          if (width > MAX_WIDTH) {
            height = Math.round((height * MAX_WIDTH) / width);
            width = MAX_WIDTH;
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, width, height);

          const dataUrl = canvas.toDataURL("image/jpeg", 0.78);
          document.getElementById("imagem-base64").value = dataUrl;
          document.getElementById("preview-img").src = dataUrl;
          document.getElementById("preview-box").style.display = "block";
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    async function carregarPosts() {
      const listaEl = document.getElementById("lista-posts");
      try {
        const resp = await fetch("/api/posts");
        postsCache = await resp.json();

        if (!postsCache.length) {
          listaEl.innerHTML = '<p style="color: var(--text-muted); font-size: 0.9rem;">Nenhuma publicação cadastrada.</p>';
          return;
        }

        listaEl.innerHTML = postsCache.map(post => `
          <div class="post-item">
            <div class="post-info">
              <div>
                <span class="badge">${post.tipo === 'instagram' ? 'Instagram' : 'Artigo'}</span>
                <span class="post-meta">${post.area} • ${formatarData(post.data)}</span>
              </div>
              <h4>${post.titulo}</h4>
              <span class="post-meta">Status: ${post.status}</span>
            </div>
            <div class="post-actions">
              <button class="btn btn-edit" onclick="editarPost(${post.id})">Editar</button>
              <button class="btn btn-danger" onclick="excluirPost(${post.id})">Excluir</button>
            </div>
          </div>
        `).join("");
      } catch (err) {
        listaEl.innerHTML = '<p style="color: #ff7b77;">Erro ao carregar publicações.</p>';
      }
    }

    document.getElementById("post-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btnSalvar = document.getElementById("btn-salvar");
      const statusEl = document.getElementById("form-status");

      btnSalvar.disabled = true;
      btnSalvar.textContent = "Salvando...";

      const payload = {
        id: document.getElementById("post-id").value || null,
        tipo: document.getElementById("tipo").value,
        titulo: document.getElementById("titulo").value.trim(),
        area: document.getElementById("area").value,
        data: document.getElementById("data").value,
        imagem: document.getElementById("imagem-base64").value,
        resumo: document.getElementById("resumo").value.trim(),
        conteudo: document.getElementById("conteudo").value.trim(),
        link: document.getElementById("link").value.trim(),
        status: document.getElementById("status").value
      };

      try {
        const resp = await fetch("/api/posts", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": senhaMaster
          },
          body: JSON.stringify(payload)
        });

        const resultado = await resp.json();
        if (resultado.sucesso) {
          statusEl.style.color = "#68d391";
          statusEl.textContent = "Salvo com sucesso!";
          limparFormulario();
          carregarPosts();
        } else {
          statusEl.style.color = "#ff7b77";
          statusEl.textContent = "Erro: " + (resultado.erro || "Falha.");
        }
      } catch (err) {
        statusEl.style.color = "#ff7b77";
        statusEl.textContent = "Erro de conexão.";
      } finally {
        btnSalvar.disabled = false;
        btnSalvar.textContent = "Salvar Publicação";
      }
    });

    function editarPost(id) {
      const post = postsCache.find(p => p.id === id);
      if (!post) return;

      document.getElementById("form-titulo").textContent = "Editando Publicação";
      document.getElementById("post-id").value = post.id;
      document.getElementById("tipo").value = post.tipo || "artigo";
      alternarCampos();
      document.getElementById("titulo").value = post.titulo || "";
      document.getElementById("area").value = post.area || "Direito da Saúde";
      document.getElementById("data").value = post.data || "";
      document.getElementById("resumo").value = post.resumo || "";
      document.getElementById("conteudo").value = post.conteudo || "";
      document.getElementById("link").value = post.link || "";
      document.getElementById("status").value = post.status || "publicado";
      document.getElementById("imagem-base64").value = post.imagem || "";

      if (post.imagem) {
        document.getElementById("preview-img").src = post.imagem;
        document.getElementById("preview-box").style.display = "block";
      } else {
        document.getElementById("preview-box").style.display = "none";
      }

      document.getElementById("btn-cancelar").style.display = "inline-flex";
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    async function excluirPost(id) {
      if (!confirm("Deseja excluir esta publicação?")) return;

      try {
        const resp = await fetch("/api/posts", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": senhaMaster
          },
          body: JSON.stringify({ acao: "excluir", id: id })
        });
        const res = await resp.json();
        if (res.sucesso) carregarPosts();
      } catch (err) {
        alert("Erro ao excluir.");
      }
    }

    function limparFormulario() {
      document.getElementById("form-titulo").textContent = "Nova Publicação";
      document.getElementById("post-form").reset();
      document.getElementById("post-id").value = "";
      document.getElementById("imagem-base64").value = "";
      document.getElementById("preview-box").style.display = "none";
      document.getElementById("data").valueAsDate = new Date();
      document.getElementById("btn-cancelar").style.display = "none";
      alternarCampos();
    }

    function formatarData(dataStr) {
      if (!dataStr) return "";
      const partes = dataStr.split("-");
      return partes.length === 3 ? `${partes[2]}/${partes[1]}/${partes[0]}` : dataStr;
    }
  </script>
</body>
</html>
